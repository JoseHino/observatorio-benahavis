  fuente: AEAT — Estadística de los declarantes del IRPF por municipios
  url_fuente: https://sede.agenciatributaria.gob.es/Sede/datosabiertos/catalogo/hacienda/Estadistica_de_los_declarantes_del_IRPF_por_municipios.shtml
  ambito_territorial: municipal
