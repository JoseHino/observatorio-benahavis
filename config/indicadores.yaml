- id: IND-ECO-003
  nombre: Periodo medio de pago a proveedores
  bloque: Finanzas municipales
  fuente: Ministerio de Hacienda — Central de Información Económico-Financiera
  url_fuente: https://serviciostelematicosext.hacienda.gob.es/SGCIEF/PMP_NET/
