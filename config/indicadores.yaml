  estado: pendiente

- id: IND-ECO-004
  nombre: Presupuesto y liquidación municipal
  bloque: Finanzas municipales
  fuente: Ministerio de Hacienda — Central de Información Económico-Financiera
  url_fuente: https://serviciostelematicosext.hacienda.gob.es/SGCIEF/
  ambito_territorial: municipal
  es_proxy: false
  granularidad_temporal: anual
  unidad: euros
  definicion: Presupuesto aprobado y liquidación de ingresos y gastos del Ayuntamiento.
  limitaciones: Las mismas que IND-ECO-003.
  estado: pendiente

# ─────────────────────────────────────────────── Bloque 6 · Clima
- id: IND-CLI-001
  nombre: Temperatura media
  bloque: Clima
  fuente: AEMET OpenData — estación 6069X Benahavís
  url_fuente: https://opendata.aemet.es/opendata/api/valores/climatologicos/diarios/
  ambito_territorial: municipal
  es_proxy: false
  granularidad_temporal: diaria
  unidad: grados Celsius
  definicion: >
    Temperatura media diaria registrada en la estación 6069X, situada dentro del
    término municipal de Benahavís a 392 metros de altitud, agregada a escala mensual
    y anual.
  limitaciones: >
    Una única estación no describe la variabilidad térmica de un término municipal que
    va del nivel del mar a la Sierra de las Nieves. Las medias anuales solo se publican
    para años con al menos 300 días observados.
  estado: disponible

- id: IND-CLI-002
  nombre: Precipitación acumulada
  bloque: Clima
  fuente: AEMET OpenData — estación 6069X Benahavís
  url_fuente: https://opendata.aemet.es/opendata/api/valores/climatologicos/diarios/
  ambito_territorial: municipal
  es_proxy: false
  granularidad_temporal: diaria
  unidad: milímetros
  definicion: Precipitación diaria acumulada a escala mensual y anual.
  limitaciones: >
    Las mismas que IND-CLI-001. Los registros marcados como «Ip» (inapreciable) se
