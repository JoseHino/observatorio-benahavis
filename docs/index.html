<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observatorio Turístico y Socioeconómico de Benahavís</title>
<meta name="description" content="Cuadro de mando de datos abiertos del municipio de Benahavís (29023): población, oferta de alojamiento, viviendas de uso turístico, demanda, empleo y clima. Fuentes oficiales con actualización automática.">
<link rel="icon" href="favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;650&display=swap" rel="stylesheet">

<!-- Mapa -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">

<!-- Kit de observatorios (no se edita por observatorio) -->
<link rel="stylesheet" href="assets/kit/obs.css">
<style>
  /* Marca de este observatorio. Único sitio donde se toca el color. */
  :root { --brand: #1c7f6b; --brand-ink: #14614f; --brand-soft: #e6f4f0; }
  :root[data-theme="dark"] { --brand: #2fa78c; --brand-ink: #58c6ac; --brand-soft: #10241f; }
  /* La agrupación del mapa hereda la marca, no el azul del kit. */
  .obs-cluster { background: color-mix(in srgb, var(--brand) 22%, var(--surface)); border-color: var(--brand); color: var(--brand-ink); }
</style>
</head>
<body>

<div id="obs-app"></div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

<script src="assets/kit/obs-charts.js"></script>
<script src="assets/kit/obs-ui.js"></script>
<script src="assets/kit/obs-map.js"></script>
<script src="assets/panel-benahavis.js"></script>

</body>
</html>
